version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Digest pins of the Linux release build images. Moving to a newer base
  # (AlmaLinux 10, Alpine 3.24) raises the oldest glibc/musl the release
  # binaries run on, so only digest updates are allowed; see the comments in
  # the Dockerfiles.
  - package-ecosystem: "docker"
    directories:
      - "/.github/builders/glibc"
      - "/.github/builders/musl"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "almalinux"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "alpine"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
