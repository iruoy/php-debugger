name: Release

on:
    push:
        tags:
            - '*'
    # prepare-release.yml pushes the release tag using GITHUB_TOKEN, and
    # GitHub Actions deliberately does not let a GITHUB_TOKEN-authored push
    # trigger other workflows (anti-recursion protection) — so the `push`
    # trigger above never fires for tags created that way. prepare-release.yml
    # explicitly dispatches this workflow via `gh workflow run` instead, which
    # is unaffected by that restriction. A human pushing a tag directly still
    # hits the `push` trigger as normal.
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to build and release (e.g. 0.3.0)'
                required: true

# Least-privilege default: build/validate jobs only ever check out code and
# upload/download workflow artifacts, none of which needs write access.
# `contents: write` and `actions: write` are granted only on the `release`
# job below, which is the one that actually publishes the GitHub release and
# dispatches docker.yml.
permissions:
    contents: read

# Serializes runs per tag, so a rerun (or a race between a human tag push and
# a prepare-release.yml dispatch for the same version) can't fire two release
# builds for the same tag in parallel — e.g. two matrices doing duplicate work
# and softprops/action-gh-release racing to create the same release.
concurrency:
    group: release-${{ github.event.inputs.tag || github.ref_name }}
    cancel-in-progress: false

env:
    # The tag to build: the pushed tag on a `push` trigger, or the input on a
    # manual/`gh workflow run` dispatch. Every checkout step below and the
    # final release-creation step key off this instead of the default ref, so
    # a workflow_dispatch run (which otherwise checks out the branch selected
    # in the UI, not the tag) still builds and releases the right commit.
    RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}

    # The oldest glibc the Linux binaries (extensions and interpreters) run on:
    # they are built with zig for this glibc version, whatever glibc the runner
    # has. 2.34 is the oldest in supported distros used for development (RHEL 9;
    # Debian 12 and Ubuntu 22.04 are newer). The build fails if a binary needs more.
    MAX_GLIBC: '2.34'


jobs:
    # Checks the tag, then resolves what every build job needs.
    #
    # A `push: tags` run always has a real, already-existing tag (RELEASE_REF
    # is just github.ref_name). A manual workflow_dispatch run instead takes
    # the tag as free-text UI/API input, so it gets stricter treatment: format
    # is checked with the same regex prepare-release.yml uses before it ever
    # creates a tag, and — for both trigger types — existence is confirmed
    # against the remote before the full build matrix fans out, so a typo
    # fails in seconds instead of burning a whole matrix of runner minutes on
    # every job's checkout.
    #
    # The PHP versions and their sources are resolved once, so all platforms in
    # a release build the same PHP patch versions: the latest php.net release
    # tarball of each version, or its current pre-release before the first
    # stable release (see .github/scripts/resolve-php-sources.py, which also
    # holds the list of PHP versions). The build matrices take their versions
    # from php-versions; jobs read their source with
    # fromJSON(needs.prepare.outputs.php-sources)[matrix.php-version].
    prepare:
        runs-on: ubuntu-latest
        outputs:
            php-versions: ${{ steps.resolve.outputs.php-versions }}
            php-sources: ${{ steps.resolve.outputs.php-sources }}
        steps:
            -   name: Validate tag
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    TAG="${{ env.RELEASE_REF }}"
                    if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                        if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                            echo "::error::'${TAG}' doesn't look like a version (expected X.Y.Z or X.Y.Z-suffix)"
                            exit 1
                        fi
                    fi
                    if ! gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
                        echo "::error::Tag '${TAG}' does not exist in ${{ github.repository }}"
                        exit 1
                    fi

            -   uses: actions/checkout@v7
                with:
                    ref: ${{ env.RELEASE_REF }}
                    sparse-checkout: .github/scripts

            -   name: Resolve PHP versions and sources
                id: resolve
                run: |
                    SOURCES=$(python3 .github/scripts/resolve-php-sources.py)
                    echo "php-sources=${SOURCES}" >> "$GITHUB_OUTPUT"
                    echo "php-versions=$(echo "$SOURCES" | python3 -c 'import json, sys; print(json.dumps(list(json.load(sys.stdin))))')" >> "$GITHUB_OUTPUT"

    build-macos:
        needs: prepare
        strategy:
            fail-fast: false
            matrix:
                php-version: ${{ fromJSON(needs.prepare.outputs.php-versions) }}
                ts:
                    - nts
                    - ts
        runs-on: macos-latest
        name: "MacOS — PHP ${{ matrix.php-version }} — arm64 — ${{ matrix.ts == 'ts' && 'TS' || 'NTS' }}"
        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ env.RELEASE_REF }}

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    coverage: none
                    extensions: xmlreader
                env:
                    phpts: ${{ matrix.ts }}

            -   name: Build extension
                run: |
                    phpize
                    ./configure --enable-php-debugger
                    make -j$(sysctl -n hw.logicalcpu 2>/dev/null || nproc)

            # Loads, and a debug client can attach and drive a script (DBGp smoke test)
            -   name: Test extension
                run: |
                    php -n -d zend_extension="$PWD/modules/php_debugger.so" -v
                    TEST_PHP_ARGS="-n -d zend_extension=$PWD/modules/php_debugger.so" \
                      php -n run-xdebug-tests.php -q tests/debugger/bug00530.phpt

            -   name: Package artifact
                run: |
                    PHP_VER="${{ matrix.php-version }}"
                    mkdir dist
                    cp modules/php_debugger.so "dist/php-debugger-php${PHP_VER}-${{ matrix.ts }}-macos-arm64.so"
                    # PIE asset: an exactly named zip with php_debugger.so at its root
                    # (see "download-url-method" in composer.json); PIE calls the macOS
                    # libc bsdlibc
                    zip -j "dist/php_php_debugger-${RELEASE_REF}_php${PHP_VER}-arm64-darwin-bsdlibc-${{ matrix.ts == 'ts' && 'zts' || 'nts' }}.zip" modules/php_debugger.so

            -   name: Upload artifact
                uses: actions/upload-artifact@v7
                with:
                    name: release--macos-${{ matrix.php-version }}-${{ matrix.ts }}
                    path: dist/

    build-linux:
        needs: prepare
        strategy:
            fail-fast: false
            matrix:
                php-version: ${{ fromJSON(needs.prepare.outputs.php-versions) }}
                ts:
                    - nts
                    - ts
                arch:
                    - runner: ubuntu-26.04
                      arch: x86_64
                    - runner: ubuntu-26.04-arm
                      arch: arm64
                libc:
                    - glibc
                    - musl
        runs-on: ${{ matrix.arch.runner }}
        name: "Linux — PHP ${{ matrix.php-version }} — ${{ matrix.arch.arch }} — ${{ matrix.libc }} — ${{ matrix.ts == 'ts' && 'TS' || 'NTS' }}"
        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ env.RELEASE_REF }}

            # The pinned zig (see setup-zig.sh), kept between runs
            -   name: Cache zig
                uses: actions/cache@v6
                with:
                    path: ${{ runner.temp }}/zig-cache
                    key: zig-${{ runner.arch }}-${{ hashFiles('.github/scripts/setup-zig.sh') }}

            # Built with zig for the target libc (glibc MAX_GLIBC or musl), so the
            # binary does not depend on the runner's glibc; see the build script,
            # which also runs the glibc build's load check and DBGp smoke test
            -   name: Build extension
                env:
                    ZIG_CACHE_DIR: ${{ runner.temp }}/zig-cache
                    PHP_URL: ${{ fromJSON(needs.prepare.outputs.php-sources)[matrix.php-version].url }}
                    PHP_SHA256: ${{ fromJSON(needs.prepare.outputs.php-sources)[matrix.php-version].sha256 }}
                    TARGET: ${{ matrix.arch.arch == 'arm64' && 'aarch64' || 'x86_64' }}-linux-${{ matrix.libc == 'glibc' && format('gnu.{0}', env.MAX_GLIBC) || 'musl' }}
                run: sh .github/scripts/build-linux-binary.sh "$PHP_URL" "$PHP_SHA256" "${{ matrix.ts }}" "$TARGET" . "$RUNNER_TEMP/out"

            # The build machine has a newer glibc than the target, so check where it
            # matters: the PHP built alongside (for the same glibc) loads the
            # extension on the oldest supported glibc
            -   name: Check it loads on older distros
                if: matrix.libc == 'glibc'
                run: |
                    for image in almalinux:9 debian:12-slim ubuntu:22.04; do
                        echo "== ${image}"
                        docker run --rm -v "$RUNNER_TEMP/php-debugger-build:/b:ro" "$image" \
                          /b/php/bin/php -n -d zend_extension=/b/ext/modules/php_debugger.so -r 'exit(extension_loaded("php_debugger") ? 0 : 1);'
                    done

            # GitHub's runners have recent CPUs; run on the oldest CPU model of the
            # architecture too, so instructions older CPUs lack fail here instead of
            # on users' machines. (The musl build uses the same compiler settings.)
            # In Debian 13, see the script for why not on the runner itself.
            -   name: Check it runs on a baseline CPU
                if: matrix.libc == 'glibc'
                run: |
                    docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/php-debugger-build:/b:ro" debian:13-slim sh -euc '
                        apt-get -qq update && apt-get -qq install -y qemu-user >/dev/null
                        sh /src/.github/scripts/check-baseline-cpu.sh /b/php/bin/php /src -d zend_extension=/b/ext/modules/php_debugger.so
                    '

            # The runner cannot run a musl PHP, so test in the official Alpine image
            # of the same version and thread safety. There is none for NTS 8.6+:
            # from 8.6 on the official images are ZTS only (and -zts is gone).
            -   name: Test in Alpine
                if: matrix.libc == 'musl' && (matrix.ts == 'ts' || contains(fromJSON('["8.2", "8.3", "8.4", "8.5"]'), matrix.php-version))
                run: |
                    case "${{ matrix.ts }}-${{ matrix.php-version }}" in
                        nts-*) IMAGE="php:${{ matrix.php-version }}-cli-alpine" ;;
                        ts-8.[2-5]) IMAGE="php:${{ matrix.php-version }}-zts-alpine" ;;
                        *) IMAGE="php:${{ matrix.php-version }}-cli-alpine" ;;
                    esac
                    docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/out:/out:ro" "$IMAGE" sh -euc '
                        cp -r /src /tmp/src && cd /tmp/src
                        PHP=$(command -v php)
                        "$PHP" -n -d zend_extension=/out/php_debugger.so -v
                        TEST_PHP_EXECUTABLE="$PHP" TEST_PHP_ARGS="-n -d zend_extension=/out/php_debugger.so" \
                          "$PHP" -n run-xdebug-tests.php -q tests/debugger/bug00530.phpt
                    '

            -   name: Package artifact
                run: |
                    PHP_VER="${{ matrix.php-version }}"
                    ARCH_TAG="${{ matrix.arch.arch }}"
                    LIBC="${{ matrix.libc }}"
                    mkdir dist
                    # PIE asset: an exactly named zip with php_debugger.so at its root
                    # (see "download-url-method" in composer.json)
                    zip -j "dist/php_php_debugger-${RELEASE_REF}_php${PHP_VER}-${ARCH_TAG}-linux-${LIBC}-${{ matrix.ts == 'ts' && 'zts' || 'nts' }}.zip" "$RUNNER_TEMP/out/php_debugger.so"
                    # The plain .so is for glibc only: php-debugger/installer matches
                    # assets on the tokens in their names and cannot tell libcs apart,
                    # so it could pick a musl .so on a glibc system
                    if [ "$LIBC" = glibc ]; then
                        cp "$RUNNER_TEMP/out/php_debugger.so" "dist/php-debugger-php${PHP_VER}-${{ matrix.ts }}-linux-${ARCH_TAG}.so"
                    fi

            -   name: Upload artifact
                uses: actions/upload-artifact@v7
                with:
                    name: release--linux-${{ matrix.php-version }}-${{ matrix.ts }}-${{ matrix.arch.arch }}-${{ matrix.libc }}
                    path: dist/

    build-windows:
        needs: prepare
        strategy:
            fail-fast: false
            matrix:
                php-version: ${{ fromJSON(needs.prepare.outputs.php-versions) }}
                ts:
                  - nts
                  - ts
        # PHP 8.6 and later are built with VS 2026, which only the
        # windows-2025-vs2026 image has
        runs-on: ${{ contains(fromJSON('["8.2", "8.3", "8.4", "8.5"]'), matrix.php-version) && 'windows-2022' || 'windows-2025-vs2026' }}
        name: "Windows — PHP ${{ matrix.php-version }} — ${{ matrix.ts == 'ts' && 'TS' || 'NTS' }}"
        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ env.RELEASE_REF }}

            -   name: Build the extension
                uses: php/php-windows-builder/extension@v1
                with:
                    php-version: ${{ matrix.php-version }}
                    arch: x64
                    ts: ${{ matrix.ts }}
                    args: --enable-php-debugger
                    run-tests: false
                    # Version in the builder's zip name; it defaults to the ref
                    # name, which on a workflow_dispatch run is the branch
                    extension-ref: ${{ env.RELEASE_REF }}

            -   name: Package artifact
                shell: pwsh
                run: |
                    # The builder leaves its package in artifacts\ (and a log zip of the
                    # same name in artifacts\logs\), already named and laid out the way
                    # PIE expects: php_{ext}-{version}-{php}-{ts}-{compiler}-{arch}.zip
                    # with a DLL of the same base name. It is the PIE asset as is.
                    $found = @(Get-Item "artifacts\php_php_debugger-$($env:RELEASE_REF)-${{ matrix.php-version }}-${{ matrix.ts }}-*-x86_64.zip")
                    if ($found.Count -ne 1) { Write-Error "Expected one builder zip in artifacts\, found $($found.Count)"; exit 1 }
                    $pieZip = $found[0]
                    New-Item -ItemType Directory -Force -Path dist | Out-Null
                    Copy-Item $pieZip.FullName -Destination dist\

                    $extracted = Join-Path $env:RUNNER_TEMP "extension"
                    Expand-Archive -Path $pieZip.FullName -DestinationPath $extracted -Force
                    $dll = Get-ChildItem -Path $extracted -Filter '*.dll' | Select-Object -First 1
                    if (-not $dll) { Write-Error "DLL not found in $($pieZip.Name)"; exit 1 }
                    Copy-Item $dll.FullName -Destination "dist\php_php-debugger-php${{ matrix.php-version }}-${{ matrix.ts }}-windows-x64.dll"

            -   name: Upload artifact
                uses: actions/upload-artifact@v7
                with:
                    name: release--windows-${{ matrix.php-version }}-${{ matrix.ts }}
                    path: dist/

    build-php-macos:
        needs: prepare
        strategy:
            fail-fast: false
            matrix:
                php-version: ${{ fromJSON(needs.prepare.outputs.php-versions) }}
                ts:
                    - nts
                    - ts
        runs-on: macos-latest
        name: "PHP Binary MacOS — PHP ${{ matrix.php-version }} — arm64 — ${{ matrix.ts == 'ts' && 'TS' || 'NTS' }}"
        env:
            # JIT disabled: incompatible with php-debugger. The PIC flag is not here:
            # its spelling depends on the PHP version, see PIC_FLAG in the build step.
            # (The Linux interpreter is built with StaticPHP, see
            # .github/scripts/build-linux-interpreter.sh.)
            CONFIGURE_FLAGS: >-
              --with-mhash
              --enable-mbstring
              --enable-mysqlnd
              --with-password-argon2
              --with-sodium=shared
              --with-openssl
              --with-zlib
              --disable-phpdbg
              --enable-opcache
              --disable-opcache-jit
              --enable-php-debugger
            # iconv path is set from the SDK in the build step; system sqlite and curl
            MACOS_FLAGS: --with-pdo-sqlite --with-sqlite3 --without-readline --with-curl
        steps:
            -   name: Checkout extension
                uses: actions/checkout@v7
                with:
                    ref: ${{ env.RELEASE_REF }}
                    path: ext-src

            -   name: Install build dependencies
                run: |
                    brew install autoconf automake libtool pkg-config \
                      openssl@3 argon2 oniguruma libsodium

            -   name: Fetch PHP source and add the extension
                env:
                    PHP_URL: ${{ fromJSON(needs.prepare.outputs.php-sources)[matrix.php-version].url }}
                    PHP_SHA256: ${{ fromJSON(needs.prepare.outputs.php-sources)[matrix.php-version].sha256 }}
                run: |
                    sh ext-src/.github/scripts/fetch-php-source.sh "$PHP_URL" "$PHP_SHA256" ~/php-src
                    cp -r ext-src ~/php-src/ext/php_debugger
                    mkdir -p ~/php-src/m4
                    cp ext-src/m4/*.m4 ~/php-src/m4/

            -   name: Build PHP with static php_debugger
                run: |
                    cd ~/php-src

                    # Get macOS SDK path for iconv headers
                    SDK_PATH=$(xcrun --show-sdk-path)
                    ICONV_PATH="${SDK_PATH}/usr"

                    # Extract the actual PHP version from the source (from main/php_version.h)
                    PHP_FULL_VERSION=$(grep 'PHP_VERSION ' main/php_version.h | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
                    PHP_MINOR_VERSION="${{ matrix.php-version }}"

                    export PATH="/opt/homebrew/bin:$PATH"

                    PREFIX="/opt/homebrew/Cellar/php@${PHP_MINOR_VERSION}/${PHP_FULL_VERSION}"
                    LOCALSTATEDIR="/opt/homebrew/var"
                    SYSCONFDIR="/opt/homebrew/etc/php/${PHP_MINOR_VERSION}"
                    CONFIG_FILE_PATH="/opt/homebrew/etc/php/${PHP_MINOR_VERSION}"
                    CONFIG_FILE_SCAN_DIR="/opt/homebrew/etc/php/${PHP_MINOR_VERSION}/conf.d"

                    # Create directories if they don't exist
                    sudo mkdir -p "${PREFIX}"
                    sudo mkdir -p "${LOCALSTATEDIR}"
                    sudo mkdir -p "${CONFIG_FILE_SCAN_DIR}"

                    ./buildconf --force

                    # PHP 8.6 bundles Libtool 2.5, which rejects --with-pic in favor of
                    # --enable-pic; 8.2-8.5 bundle Libtool 1.5, which only knows --with-pic
                    # (and would merely warn about --enable-pic, silently building without it).
                    case "${{ matrix.php-version }}" in
                        8.[2-5]) PIC_FLAG=--with-pic ;;
                        *) PIC_FLAG=--enable-pic ;;
                    esac

                    ./configure \
                      --prefix="${PREFIX}" \
                      --localstatedir="${LOCALSTATEDIR}" \
                      --sysconfdir="${SYSCONFDIR}" \
                      --with-config-file-path="${CONFIG_FILE_PATH}" \
                      --with-config-file-scan-dir="${CONFIG_FILE_SCAN_DIR}" \
                      $CONFIGURE_FLAGS \
                      $PIC_FLAG \
                      $MACOS_FLAGS \
                      --with-iconv="${ICONV_PATH}" \
                      ${{ matrix.ts == 'ts' && '--enable-zts' || '' }}

                    # PHP= keeps the Zend VM files generated in the release tag. Otherwise make
                    # regenerates them with whatever php the runner has, and PHP 8.2's
                    # generator writes a broken zend_vm_opcodes.h when that php defines
                    # ZEND_VM_KIND itself (PHP 8.5 does). The regeneration is skipped when
                    # $(PHP) is empty: see the vm.gen.intermediate rule in Zend/Makefile.frag.
                    make -j$(sysctl -n hw.logicalcpu) PHP=

            # The debugger is compiled in, with its functions and INI settings
            -   name: Test the interpreter
                run: |
                    ~/php-src/sapi/cli/php -v | grep -q "PHP Debugger"
                    ~/php-src/sapi/cli/php -r "
                      assert(extension_loaded('php_debugger'), 'php_debugger not loaded');
                      assert(function_exists('xdebug_break'), 'xdebug_break missing');
                      assert(function_exists('xdebug_info'), 'xdebug_info missing');
                      assert(function_exists('php_debugger_info'), 'php_debugger_info missing');
                      assert(ini_get('xdebug.client_port') !== false, 'xdebug.* INI missing');
                      assert(ini_get('php_debugger.client_port') !== false, 'php_debugger.* INI missing');
                      echo 'All tests passed!' . PHP_EOL;
                    "

            -   name: Package artifact
                run: |
                    mkdir dist
                    cp ~/php-src/sapi/cli/php "dist/php-php${{ matrix.php-version }}-${{ matrix.ts }}-macos-arm64"
                    chmod +x dist/*

            -   name: Upload artifact
                uses: actions/upload-artifact@v7
                with:
                    name: release--php-php${{ matrix.php-version }}-${{ matrix.ts }}-macos-arm64
                    path: dist/

    # The libraries the Linux interpreters link in statically depend only on the
    # architecture, not on the PHP version or thread safety, so they are built
    # once per architecture here and shared by the build-php-linux jobs.
    build-php-linux-libs:
        needs: prepare
        strategy:
            fail-fast: false
            matrix:
                arch:
                    - runner: ubuntu-26.04
                      arch: x86_64
                    - runner: ubuntu-26.04-arm
                      arch: arm64
        runs-on: ${{ matrix.arch.runner }}
        name: "PHP Binary Linux libraries — ${{ matrix.arch.arch }}"
        steps:
            -   name: Checkout extension
                uses: actions/checkout@v7
                with:
                    ref: ${{ env.RELEASE_REF }}

            -   name: Install build dependencies
                run: sudo apt-get update -qq && sudo apt-get install -y -qq re2c gettext

            -   name: Build the libraries
                env:
                    # StaticPHP looks up its library sources through the GitHub API
                    GITHUB_TOKEN: ${{ github.token }}
                run: sh .github/scripts/build-linux-interpreter.sh libs "$RUNNER_TEMP/staticphp-libs.tar.gz"

            -   name: Upload libraries
                uses: actions/upload-artifact@v7
                with:
                    # Not release--*: only shared between jobs, never published
                    name: staticphp-libs-${{ matrix.arch.arch }}
                    path: ${{ runner.temp }}/staticphp-libs.tar.gz
                    retention-days: 1

    build-php-linux:
        needs: [prepare, build-php-linux-libs]
        strategy:
            fail-fast: false
            matrix:
                php-version: ${{ fromJSON(needs.prepare.outputs.php-versions) }}
                ts:
                    - nts
                    - ts
                arch:
                    - runner: ubuntu-26.04
                      arch: x86_64
                    - runner: ubuntu-26.04-arm
                      arch: arm64
        runs-on: ${{ matrix.arch.runner }}
        name: "PHP Binary Linux — PHP ${{ matrix.php-version }} — ${{ matrix.arch.arch }} — ${{ matrix.ts == 'ts' && 'TS' || 'NTS' }}"
        steps:
            -   name: Checkout extension
                uses: actions/checkout@v7
                with:
                    ref: ${{ env.RELEASE_REF }}

            -   name: Install build dependencies
                run: sudo apt-get update -qq && sudo apt-get install -y -qq re2c gettext

            # Built with StaticPHP: every library linked in except glibc, which its
            # zig toolchain targets at MAX_GLIBC, so it runs on any distro with that
            # glibc or newer and can still load shared extensions. The build script
            # also checks the linked libraries, the glibc version, the extensions,
            # and runs a DBGp smoke test.
            -   name: Download the libraries
                uses: actions/download-artifact@v8
                with:
                    name: staticphp-libs-${{ matrix.arch.arch }}
                    path: ${{ runner.temp }}

            -   name: Build PHP with static php_debugger
                env:
                    PHP_URL: ${{ fromJSON(needs.prepare.outputs.php-sources)[matrix.php-version].url }}
                    PHP_SHA256: ${{ fromJSON(needs.prepare.outputs.php-sources)[matrix.php-version].sha256 }}
                    # StaticPHP looks up its library sources through the GitHub API
                    GITHUB_TOKEN: ${{ github.token }}
                run: |
                    mkdir -p dist
                    sh .github/scripts/build-linux-interpreter.sh php "$PHP_URL" "$PHP_SHA256" "${{ matrix.ts }}" . \
                      "dist/php-php${{ matrix.php-version }}-${{ matrix.ts }}-linux-${{ matrix.arch.arch }}" \
                      "$RUNNER_TEMP/staticphp-libs.tar.gz"

            # GitHub's runners have recent CPUs; run on the oldest CPU model of the
            # architecture too, so instructions older CPUs lack fail here instead of
            # on users' machines. In Debian 13, see the script for why not on the runner.
            -   name: Check it runs on a baseline CPU
                run: |
                    docker run --rm -v "$PWD:/src:ro" debian:13-slim sh -euc '
                        apt-get -qq update && apt-get -qq install -y qemu-user >/dev/null
                        sh /src/.github/scripts/check-baseline-cpu.sh "/src/dist/$0" /src
                    ' "php-php${{ matrix.php-version }}-${{ matrix.ts }}-linux-${{ matrix.arch.arch }}"

            -   name: Check it runs on other distros
                run: |
                    for image in almalinux:9 debian:12-slim ubuntu:22.04 ubuntu:26.04; do
                        echo "== ${image}"
                        docker run --rm -v "$PWD/dist:/dist:ro" "$image" \
                          /dist/php-php${{ matrix.php-version }}-${{ matrix.ts }}-linux-${{ matrix.arch.arch }} -n -v
                    done

            -   name: Upload artifact
                uses: actions/upload-artifact@v7
                with:
                    name: release--php-php${{ matrix.php-version }}-${{ matrix.ts }}-linux-${{ matrix.arch.arch }}
                    path: dist/

    # Lives in its own reusable workflow so pull requests that change it are
    # built and tested on Windows runners without cutting a release.
    build-php-windows:
        needs: prepare
        uses: ./.github/workflows/build-php-windows.yml
        with:
            # Same value as env.RELEASE_REF, which is not available in with: when
            # calling a reusable workflow, so the expression is repeated here.
            ref: ${{ github.event.inputs.tag || github.ref_name }}
            php-sources: ${{ needs.prepare.outputs.php-sources }}

    release:
        needs: [build-macos, build-linux, build-windows, build-php-macos, build-php-linux, build-php-windows]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: write
        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ env.RELEASE_REF }}

            # Every build job uploads exactly the files it publishes, in an
            # artifact named release--*. Other artifacts in the run, such as
            # php-windows-builder's own uploads, are left out.
            -   name: Download release assets
                uses: actions/download-artifact@v8
                with:
                    pattern: release--*
                    merge-multiple: true
                    path: release-assets

            -   name: List release assets
                run: ls -la release-assets/

            -   name: Create release
                uses: softprops/action-gh-release@v3
                with:
                    # on a `push` trigger this is inferred from GITHUB_REF; on
                    # workflow_dispatch GITHUB_REF is the branch picked in the
                    # UI, not the tag, so it must be set explicitly here too
                    tag_name: ${{ env.RELEASE_REF }}
                    generate_release_notes: true
                    files: release-assets/*

            -   name: Trigger Docker image build
                # This step's own release-publish above used GITHUB_TOKEN, and GitHub
                # Actions deliberately doesn't let a GITHUB_TOKEN-authored event —
                # including the `release: published` event that action just fired —
                # trigger other workflows (the same anti-recursion protection that made
                # prepare-release.yml's tag push not trigger this workflow). So
                # docker.yml's `release: published` trigger never fires here either;
                # dispatch it explicitly instead. target=prod is required: without it,
                # docker.yml only auto-selects prod for an actual `release` event, and a
                # workflow_dispatch run would otherwise default to pushing -dev images.
                #
                # No tag is passed through: docker.yml resolves "which release to build"
                # from `gh release view` (latest published) when dispatched manually. That
                # means re-releasing an older tag via this workflow's own workflow_dispatch
                # (e.g. rebuilding 0.1.5 while 0.2.3 is latest) will publish Docker images
                # for whatever is currently latest, not the tag just released. Fine for the
                # normal case (releasing the newest tag) — if you ever need to re-release an
                # older tag's Docker images specifically, dispatch docker.yml by hand instead.
                # The GitHub release above has already been published by this point — a
                # failure here means the docker.yml mirror didn't get kicked off, not that
                # the release itself failed. Warn rather than fail the job, so a red X here
                # doesn't get misread as "the release failed and needs rerunning".
                if: github.repository == 'php-debugger/php-debugger'
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    for attempt in 1 2 3; do
                        gh workflow run docker.yml --ref main -f target=prod && exit 0
                        [ "$attempt" -lt 3 ] && sleep 5
                    done
                    echo "::warning::Failed to dispatch docker.yml after 3 attempts — the release itself published fine, but rerun docker.yml manually from the Actions UI with target=prod to publish matching Docker images"
