name: FrankenPHP

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

# A newer push to a pull request supersedes its older run
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    worker-mode:
        runs-on: ubuntu-latest
        name: "Worker mode"
        timeout-minutes: 20
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Worker-mode regression tests
                run: tests/frankenphp/run-worker-tests.sh
                env:
                    HTTP_PORT: 8080
                    DBGP_PORT: 9003
